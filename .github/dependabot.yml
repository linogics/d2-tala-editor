version: 2
updates:
  - package-ecosystem: gomod
    directory: /wasm
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # svelte-check peers typescript ^5 || ^6 only.
      - dependency-name: typescript
        versions: ['>=7']
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
