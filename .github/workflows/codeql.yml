name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Go module lives in wasm/, so it is built by hand for both targets.
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version-file: wasm/go.mod
          cache-dependency-path: wasm/go.sum
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.language == 'go'
        name: Build
        run: cd wasm && go build ./... && GOOS=js GOARCH=wasm go build ./...
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
