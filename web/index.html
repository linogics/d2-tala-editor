<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>d2-tala-editor</title>
    <script>
      // Apply the saved mode before first paint so there is no flash.
      try {
        const m = localStorage.getItem('d2-editor:mode')
        if (m === 'light' || m === 'dark') document.documentElement.dataset.mode = m
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
